<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#F6EEE1; color:#3B2A1E; font-family:'Tajawal',sans-serif; padding:20px; }
  header{ background:#3B2A1E; color:#fff; padding:20px; border-radius:10px; margin-bottom:20px; }
  header h1{ font-size:24px; margin-bottom:5px; }
  .main{ max-width:800px; margin:0 auto; }
  .cat-block{ background:#fff; border:1px solid #E2D2B4; border-radius:12px; padding:20px; margin-bottom:20px; }
  .cat-block h3{ font-size:18px; margin-bottom:15px; color:#3B2A1E; border-bottom:2px solid #E2D2B4; padding-bottom:10px; }
  .item{ background:#F6EEE1; padding:15px; margin-bottom:10px; border-radius:8px; border:1px solid #E2D2B4; }
  .item-row{ display:grid; grid-template-columns:1fr 80px 80px; gap:10px; align-items:center; margin-bottom:8px; }
  input, textarea{ padding:8px 10px; border:1px solid #E2D2B4; border-radius:6px; font-family:'Tajawal'; font-size:14px; width:100%; }
  label{ display:block; font-size:12px; color:#7A6650; margin-bottom:4px; margin-top:8px; }
  button{ padding:10px 15px; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-family:'Tajawal'; font-size:13px; }
  .btn-add{ background:#C1704A; color:#fff; width:100%; margin-top:10px; }
  .btn-del{ background:#B3413A; color:#fff; padding:6px 10px; font-size:12px; }
  .btn-export{ background:#3B2A1E; color:#fff; width:100%; padding:12px; margin-top:20px; }
  .btn-secondary{ background:#fff; border:1px solid #E2D2B4; color:#3B2A1E; width:48%; }
  .bottom-buttons{ display:flex; gap:10px; margin-top:20px; }
  .modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100; }
  .modal.open{ display:flex; }
  .modal-box{ background:#fff; border-radius:12px; padding:30px; max-width:600px; width:100%; max-height:80vh; overflow-y:auto; }
  .modal-box h2{ margin-bottom:15px; }
  .modal-box textarea{ min-height:300px; }
  .modal-buttons{ display:flex; gap:10px; margin-top:15px; }
  .modal-buttons button{ flex:1; }
  .qr-container{ text-align:center; padding:20px; }
  .qr-canvas{ max-width:300px; margin:0 auto; }
</style>
</head>
<body>

<header>
  <h1>لوحة إدارة القائمة</h1>
  <p>صاروج بيكري</p>
</header>

<div class="main" id="mainContent"></div>

<div class="bottom-buttons">
  <button class="btn-secondary" id="previewBtn">👁 معاينة</button>
  <button class="btn-secondary" id="qrcodeBtn">📱 باركود</button>
  <button class="btn-export" id="exportBtn">تصدير ⇩</button>
</div>

<div class="modal" id="exportModal">
  <div class="modal-box">
    <h2>انسخ هذا النص في data.js</h2>
    <textarea id="exportText" readonly></textarea>
    <div class="modal-buttons">
      <button class="btn-secondary" onclick="document.getElementById('exportModal').classList.remove('open')">إغلاق</button>
      <button class="btn-export" onclick="copyToClipboard()">نسخ</button>
    </div>
  </div>
</div>

<div class="modal" id="qrcodeModal">
  <div class="modal-box">
    <h2>الباركود - QR Code</h2>
    <div class="qr-container">
      <img id="qrcodeImg" src="" alt="QR Code" style="max-width:300px; border:2px solid #E2D2B4; padding:10px; border-radius:10px;">
    </div>
    <p style="text-align:center; margin:15px 0; color:#7A6650; font-size:13px;">أظهر على الطاولات</p>
    <div id="qrcodeUrl" style="background:#F6EEE1; padding:10px; border-radius:8px; word-break:break-all; font-size:12px; font-family:monospace; margin-bottom:15px;"></div>
    <button class="btn-export" onclick="downloadQR()">تحميل</button>
    <button class="btn-secondary" style="width:100%; margin-top:10px;" onclick="document.getElementById('qrcodeModal').classList.remove('open')">إغلاق</button>
  </div>
</div>

<script src="data.js?v=2025"></script>
<script>
let workingData = JSON.parse(JSON.stringify(CATEGORIES));

function render(){
  const html = workingData.map((cat,ci)=>`
    <div class="cat-block">
      <h3><input value="${cat.nameAr}" onchange="workingData[${ci}].nameAr=this.value; render();" style="border:none; background:transparent; width:100%;"></h3>
      ${cat.items.map((it,ii)=>`
        <div class="item">
          <div class="item-row">
            <input value="${it.nameAr}" onchange="workingData[${ci}].items[${ii}].nameAr=this.value;">
            <input type="number" step="0.001" value="${it.price}" onchange="workingData[${ci}].items[${ii}].price=parseFloat(this.value||0);">
            <label><input type="checkbox" ${it.available?'checked':''} onchange="workingData[${ci}].items[${ii}].available=this.checked;"> متوفر</label>
            <button class="btn-del" onclick="workingData[${ci}].items.splice(${ii},1); render();">✕</button>
          </div>
          <label>الاسم الإنجليزي:</label>
          <input value="${it.nameEn||''}" onchange="workingData[${ci}].items[${ii}].nameEn=this.value;" placeholder="English name">
          <label>رابط الصورة:</label>
          <input type="url" value="${it.image||''}" onchange="workingData[${ci}].items[${ii}].image=this.value;" placeholder="https://...">
        </div>
      `).join('')}
      <button class="btn-add" onclick="workingData[${ci}].items.push({id:'new',nameAr:'منتج جديد',nameEn:'New Item',price:0.5,image:'',available:true}); render();">+ منتج</button>
    </div>
  `).join('');
  document.getElementById('mainContent').innerHTML = html;
}

document.getElementById('exportBtn').addEventListener('click',()=>{
  let out = `const CATEGORIES = [`;
  workingData.forEach((cat,ci)=>{
    out += `{id:"${cat.id}",nameAr:"${cat.nameAr.replace(/"/g,'\\"')}",nameEn:"${(cat.nameEn||cat.nameAr).replace(/"/g,'\\"')}",items:[`;
    cat.items.forEach((it,ii)=>{
      out += `{id:"${it.id}",nameAr:"${it.nameAr.replace(/"/g,'\\"')}",nameEn:"${(it.nameEn||it.nameAr).replace(/"/g,'\\"')}",price:${Number(it.price).toFixed(3)},image:"${(it.image||'').replace(/"/g,'\\"')}",available:${it.available}}${ii<cat.items.length-1?',':''}`;
    });
    out += `]}${ci<workingData.length-1?',':''}`;
  });
  out += `];\nconst SHOP_NAME_AR="${SHOP_NAME_AR}";\nconst SHOP_NAME_EN="${SHOP_NAME_EN}";\nconst CURRENCY_LABEL="${CURRENCY_LABEL}";\nconst CURRENT_LANG="ar";`;
  document.getElementById('exportText').value = out;
  document.getElementById('exportModal').classList.add('open');
});

function copyToClipboard(){
  const text = document.getElementById('exportText');
  text.select();
  document.execCommand('copy');
  alert('تم النسخ!');
}

document.getElementById('previewBtn').addEventListener('click',()=>window.open('index.html','_blank'));

document.getElementById('qrcodeBtn').addEventListener('click',()=>{
  const url = 'https://maawali-s.github.io/menu/index.html';
  document.getElementById('qrcodeUrl').textContent = url;
  const qrcodeAPI = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
  document.getElementById('qrcodeImg').src = qrcodeAPI;
  document.getElementById('qrcodeModal').classList.add('open');
});

function downloadQR(){
  const img = document.getElementById('qrcodeImg');
  const link = document.createElement('a');
  link.href = img.src;
  link.download = 'menu-qr.png';
  link.click();
}

render();
</script>
</body>
</html>
