<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | صاروج بيكري</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6EEE1; --bg-card:#FFFBF3; --ink:#3B2A1E; --ink-soft:#7A6650;
    --accent:#C1704A; --accent-dark:#9C5636; --line:#E2D2B4; --danger:#B3413A;
    --shadow:0 6px 18px rgba(59,42,30,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:'Tajawal',sans-serif;}
  header{
    padding:20px; background:var(--ink); color:#fff;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{ font-family:'Aref Ruqaa',serif; font-size:22px; margin:0; }
  header p{ margin:4px 0 0; font-size:12px; color:#D8C7AE; }
  .warn-banner{
    background:#FCEFD9; border-bottom:1px solid var(--line); color:var(--ink-soft);
    font-size:12.5px; padding:10px 20px; line-height:1.7;
  }
  main{ max-width:760px; margin:0 auto; padding:20px 16px 90px; }
  .cat-block{
    background:var(--bg-card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:18px; box-shadow:var(--shadow);
  }
  .cat-block-head{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .cat-block-head input.cat-name{
    font-family:'Aref Ruqaa',serif; font-size:19px; font-weight:700;
    border:none; background:transparent; flex:1; color:var(--ink); outline:none;
    border-bottom:1px dashed transparent;
  }
  .cat-block-head input.cat-name:focus{ border-bottom-color:var(--accent); }
  .del-cat{ background:none; border:none; color:var(--danger); font-size:13px; cursor:pointer; }
  .item-row{
    display:grid; gap:8px; align-items:start;
    margin-bottom:12px; padding:12px; border:1px solid var(--line); border-radius:10px;
    background:#fff;
  }
  .item-row-header{
    display:grid; grid-template-columns: 60px 1fr 90px 70px 30px; gap:8px; align-items:center;
  }
  .item-image-preview{
    width:60px; height:60px; border-radius:8px; object-fit:cover;
    background:var(--line); border:1px solid var(--line);
  }
  .item-row input[type=text], .item-row input[type=number], .item-row input[type=url]{
    padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:'Tajawal';
    font-size:14px; background:#fff; color:var(--ink); width:100%;
  }
  .item-image-input{
    grid-column:1/-1;
  }
  .item-image-input label{
    font-size:12px; color:var(--ink-soft); display:block; margin-bottom:4px;
  }
  .image-upload-group{
    display:flex; gap:8px; align-items:center;
  }
  .image-upload-group input[type=file]{
    flex:1; padding:6px 8px; border:1px solid var(--line); border-radius:8px;
    font-size:12px; font-family:'Tajawal';
  }
  .image-upload-btn{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer;
    font-family:'Tajawal'; white-space:nowrap;
  }
  .image-upload-btn:disabled{
    background:var(--ink-soft); cursor:not-allowed;
  }
  .image-url-input{
    margin-top:6px;
  }
  .avail-toggle{
    display:flex; align-items:center; justify-content:center; gap:4px; font-size:11px; cursor:pointer;
    color:var(--ink-soft);
  }
  .avail-toggle input{ transform:scale(1.15); }
  .del-item{ background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; }
  .add-item-btn{
    background:none; border:1.5px dashed var(--accent); color:var(--accent-dark);
    border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; cursor:pointer;
    width:100%; margin-top:4px; font-family:'Tajawal';
  }
  .add-cat-btn{
    background:var(--bg-card); border:1.5px dashed var(--line); color:var(--ink-soft);
    border-radius:14px; padding:14px; font-size:14px; font-weight:700; cursor:pointer;
    width:100%; font-family:'Tajawal';
  }
  .bottom-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--ink); padding:14px 20px;
    display:flex; gap:10px; justify-content:center; z-index:10; flex-wrap:wrap;
  }
  .bottom-bar button{
    padding:12px 20px; border-radius:12px; border:none; font-weight:700; font-size:14px;
    cursor:pointer; font-family:'Tajawal'; flex:1; min-width:140px;
  }
  .btn-primary{ background:var(--accent); color:#fff; }
  .btn-secondary{ background:#fff; color:var(--ink); }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,14,8,.6); display:none;
    align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:16px; padding:20px; max-width:560px; width:100%;
    max-height:80vh; display:flex; flex-direction:column;
  }
  .modal h3{ margin-top:0; font-size:16px; }
  .modal textarea{
    flex:1; width:100%; min-height:280px; font-family:monospace; font-size:12.5px;
    border:1px solid var(--line); border-radius:10px; padding:10px; direction:ltr; text-align:left;
    resize:vertical;
  }
  .modal-actions{ display:flex; gap:10px; margin-top:12px; }
  .modal-actions button{
    flex:1; padding:11px; border-radius:10px; border:none; font-weight:700; cursor:pointer;
    font-family:'Tajawal'; font-size:13.5px;
  }
  .qr-modal{ max-width:420px; }
  .qr-modal .modal{ max-width:420px; }
  .qr-container{ text-align:center; padding:20px 0; }
  .qr-canvas{ border:2px solid var(--line); border-radius:12px; padding:10px; background:#fff; max-width:100%; }
  #qrCanvas{ display:inline-block; }
  .qr-info{ font-size:13px; color:var(--ink-soft); margin:14px 0; line-height:1.6; }
  .qr-url{ background:var(--bg-card); border:1px solid var(--line); border-radius:10px;
    padding:10px; font-size:12px; word-break:break-all; margin:10px 0; font-family:monospace;
    direction:ltr; text-align:left;
  }
  .upload-status{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .upload-status.success{ color:#2d8659; }
  .upload-status.error{ color:var(--danger); }
</style>
</head>
<body>
<header><div><h1>لوحة إدارة القائمة</h1><p>مخبز صاروج بيكري</p></div></header>
<div class="warn-banner">عدّل الأسماء والأسعار والصور وتوفّر المنتجات هنا، ثم اضغط «تصدير الكود المحدث» وانسخ النص في data.js</div>
<main id="catContainer"></main>
<button class="add-cat-btn" id="addCatBtn" style="max-width:760px;margin:0 auto 40px;display:block;width:calc(100% - 32px);">+ إضافة قسم جديد</button>
<div class="bottom-bar">
  <button class="btn-secondary" id="previewBtn">👁 معاينة</button>
  <button class="btn-secondary" id="qrcodeBtn">📱 باركود</button>
  <button class="btn-primary" id="exportBtn">تصدير ⇩</button>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>انسخ هذا النص في data.js</h3>
    <textarea id="exportArea" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" id="closeModalBtn">إغلاق</button>
      <button class="btn-primary" id="copyBtn">نسخ</button>
    </div>
  </div>
</div>
<div class="modal-overlay qr-modal" id="qrModalOverlay">
  <div class="modal">
    <h3>الباركود - QR Code</h3>
    <div class="qr-container"><div id="qrCanvas" class="qr-canvas"></div></div>
    <div class="qr-info">أظهر هذا الباركود على الطاولات</div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="closeQrBtn">إغلاق</button>
      <button class="btn-primary" id="downloadQrBtn">تحميل</button>
    </div>
  </div>
</div>

  {id:"bakery",nameAr:"الحلويات والمخبوزات",nameEn:"Dessert & Bakery",items:[{id:"bk-1",nameAr:"كرواسون سادة",nameEn:"Plain Croissant",price:1.000,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=150&q=70",available:true},{id:"bk-2",nameAr:"كرواسون شوكليت",nameEn:"Chocolate Croissant",price:1.400,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=150&q=70",available:true},{id:"bk-3",nameAr:"كرواسون تركي",nameEn:"Turkish Croissant",price:1.700,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=150&q=70",available:true},{id:"bk-4",nameAr:"كرواسون حلومي",nameEn:"Halloumi Croissant",price:1.700,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=150&q=70",available:true},{id:"bk-5",nameAr:"كرواسون بيض",nameEn:"Egg Croissant",price:1.700,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=150&q=70",available:true},{id:"bk-6",nameAr:"دانيش بيري",nameEn:"Danish Pastry",price:1.000,image:"https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=150&q=70",available:true},{id:"bk-7",nameAr:"شوكليت كيك",nameEn:"Chocolate Cake",price:2.500,image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=150&q=70",available:true},{id:"bk-8",nameAr:"كريمي كيك",nameEn:"Creamy Cake",price:2.500,image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=150&q=70",available:true},{id:"bk-9",nameAr:"كيكة التمر",nameEn:"Date Cake",price:2.500,image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=150&q=70",available:true},{id:"bk-10",nameAr:"بيستاشيو كيك",nameEn:"Pistachio Cake",price:2.500,image:"https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=150&q=70",available:true}]}
];
const SHOP_NAME_AR="مخبز صاروج بيكري",SHOP_NAME_EN="Sarouj Bakery",CURRENCY_LABEL="ر.ع.";

let workingData=JSON.parse(JSON.stringify(CATEGORIES));
function uid(p){return p+'-'+Math.random().toString(36).slice(2,8);}
async function uploadImageToSupabase(file){
  try{
    const fn=`products/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${file.name.replace(/[^a-z0-9.]/gi,'_')}`;
    const{data,error}=await supabase.storage.from('menu').upload(fn,file,{cacheControl:'3600',upsert:false});
    if(error)throw error;
    const{data:{publicUrl}}=supabase.storage.from('menu').getPublicUrl(fn);
    return publicUrl;
  }catch(e){console.error(e);throw e;}
}
function render(){
  const c=document.getElementById('catContainer');c.innerHTML='';
  workingData.forEach((cat,ci)=>{
    const b=document.createElement('div');b.className='cat-block';
    b.innerHTML=`<div class="cat-block-head"><input class="cat-name" value="${esc(cat.nameAr)}" data-ci="${ci}"><button class="del-cat" data-ci="${ci}">✕</button></div><div class="items-wrap" data-ci="${ci}"></div><button class="add-item-btn" data-ci="${ci}">+ منتج</button>`;
    c.appendChild(b);
    const iw=b.querySelector('.items-wrap');
    cat.items.forEach((it,ii)=>{
      const r=document.createElement('div');r.className='item-row';
      r.innerHTML=`<div class="item-row-header"><img src="${it.image||''}" class="item-image-preview" onerror="this.style.opacity='0.3'"><input value="${esc(it.nameAr)}" data-ci="${ci}" data-ii="${ii}" data-field="nameAr"><input type="number" step="0.001" value="${it.price}" data-ci="${ci}" data-ii="${ii}" data-field="price"><label class="avail-toggle"><input type="checkbox" ${it.available?'checked':''} data-ci="${ci}" data-ii="${ii}" data-field="available">متوفر</label><button class="del-item" data-ci="${ci}" data-ii="${ii}">✕</button></div><div class="item-image-input"><label>الصورة:</label><div class="image-upload-group"><input type="file" accept="image/*" data-ci="${ci}" data-ii="${ii}"><button class="image-upload-btn" data-ci="${ci}" data-ii="${ii}">رفع</button></div><input type="url" value="${esc(it.image||'')}" data-ci="${ci}" data-ii="${ii}" data-field="image"><div class="upload-status" data-ci="${ci}" data-ii="${ii}"></div></div>`;
      iw.appendChild(r);
    });
  });
  c.querySelectorAll('input[data-field]').forEach(inp=>inp.addEventListener('input',()=>{
    const ci=+inp.dataset.ci,ii=+inp.dataset.ii,f=inp.dataset.field;
    if(f==='price')workingData[ci].items[ii][f]=parseFloat(inp.value||0);
    else if(f==='image'){workingData[ci].items[ii][f]=inp.value;inp.parentElement.parentElement.querySelector('.item-image-preview').src=inp.value;}
    else workingData[ci].items[ii][f]=inp.value;
  }));
  c.querySelectorAll('input[type="checkbox"]').forEach(inp=>inp.addEventListener('change',()=>{
    workingData[+inp.dataset.ci].items[+inp.dataset.ii].available=inp.checked;
  }));
  c.querySelectorAll('.image-upload-btn').forEach(btn=>btn.addEventListener('click',async()=>{
    const ci=+btn.dataset.ci,ii=+btn.dataset.ii,fi=btn.previousElementSibling.querySelector('input[type="file"]'),file=fi.files[0];
    if(!file)return;btn.disabled=true;btn.textContent='جاري...';
    const st=btn.parentElement.nextElementSibling.nextElementSibling;
    try{
      const url=await uploadImageToSupabase(file);workingData[ci].items[ii].image=url;
      btn.parentElement.nextElementSibling.value=url;btn.parentElement.parentElement.querySelector('.item-image-preview').src=url;fi.value='';
      st.textContent='✓ تم الرفع';st.classList.add('success');setTimeout(()=>{st.textContent='';st.classList.remove('success');},2000);
    }catch(e){st.textContent='✗ خطأ';st.classList.add('error');}finally{btn.disabled=false;btn.textContent='رفع';}
  }));
  c.querySelectorAll('.del-item').forEach(btn=>btn.addEventListener('click',()=>{
    workingData[+btn.dataset.ci].items.splice(+btn.dataset.ii,1);render();
  }));
  c.querySelectorAll('.del-cat').forEach(btn=>btn.addEventListener('click',()=>{
    if(confirm('حذف القسم؟')){workingData.splice(+btn.dataset.ci,1);render();}
  }));
  c.querySelectorAll('.add-item-btn').forEach(btn=>btn.addEventListener('click',()=>{
    const ci=+btn.dataset.ci;workingData[ci].items.push({id:uid('new'),nameAr:'منتج جديد',nameEn:'New',price:0.500,image:'',available:true});render();
  }));
  c.querySelectorAll('.cat-name').forEach(inp=>inp.addEventListener('input',()=>{
    workingData[+inp.dataset.ci].nameAr=inp.value;
  }));
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
document.getElementById('addCatBtn').addEventListener('click',()=>{
  workingData.push({id:uid('cat'),nameAr:'قسم جديد',nameEn:'New',items:[]});render();
});
function generateCode(){
  let out=`const CATEGORIES=[`;
  workingData.forEach((cat,ci)=>{
    out+=`{id:"${cat.id}",nameAr:"${cat.nameAr.replace(/"/g,'\\"')}",nameEn:"${(cat.nameEn||'').replace(/"/g,'\\"')}",items:[`;
    cat.items.forEach((it,ii)=>{
      out+=`{id:"${it.id}",nameAr:"${it.nameAr.replace(/"/g,'\\"')}",nameEn:"${(it.nameEn||'').replace(/"/g,'\\"')}",price:${Number(it.price).toFixed(3)},image:"${(it.image||'').replace(/"/g,'\\"')}",available:${it.available}}${ii<cat.items.length-1?',':''}`;
    });
    out+=`]}${ci<workingData.length-1?',':''}`;
  });
  out+=`];\nconst SHOP_NAME_AR="${SHOP_NAME_AR}";const SHOP_NAME_EN="${SHOP_NAME_EN}";const CURRENCY_LABEL="${CURRENCY_LABEL}";const CURRENT_LANG="ar";`;
  return out;
}
document.getElementById('exportBtn').addEventListener('click',()=>{
  document.getElementById('exportArea').value=generateCode();document.getElementById('modalOverlay').classList.add('open');
});
document.getElementById('closeModalBtn').addEventListener('click',()=>{document.getElementById('modalOverlay').classList.remove('open');});
document.getElementById('copyBtn').addEventListener('click',()=>{
  const a=document.getElementById('exportArea');a.select();document.execCommand('copy');
  const b=document.getElementById('copyBtn');b.textContent='تم النسخ ✓';setTimeout(()=>b.textContent='نسخ',1500);
});
document.getElementById('previewBtn').addEventListener('click',()=>{window.open('index.html','_blank');});
document.getElementById('qrcodeBtn').addEventListener('click',()=>{
  const url='https://maawali-s.github.io/menu/index.html';document.getElementById('qrUrl').textContent=url;
  const qc=document.getElementById('qrCanvas');qc.innerHTML='';new QRCode(qc,{text:url,width:280,height:280,colorDark:'#3B2A1E',colorLight:'#FFFBF3'});
  document.getElementById('qrModalOverlay').classList.add('open');
});
document.getElementById('closeQrBtn').addEventListener('click',()=>{document.getElementById('qrModalOverlay').classList.remove('open');});
document.getElementById('downloadQrBtn').addEventListener('click',()=>{
  const c=document.querySelector('#qrCanvas canvas');
  if(c){const l=document.createElement('a');l.href=c.toDataURL('image/png');l.download='menu-qr.png';l.click();}
});
[document.getElementById('qrModalOverlay'),document.getElementById('modalOverlay')].forEach(m=>m.addEventListener('click',(e)=>{if(e.target.id){m.classList.remove('open');}}));
render();
</script>
</body>
</html>
