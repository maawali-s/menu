<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#F6EEE1; color:#3B2A1E; font-family:'Tajawal',sans-serif; padding:20px; }
  header{ background:#3B2A1E; color:#fff; padding:20px; border-radius:10px; margin-bottom:20px; }
  header h1{ font-size:24px; margin-bottom:5px; }
  .main{ max-width:800px; margin:0 auto; }
  .cat-block{ background:#fff; border:1px solid #E2D2B4; border-radius:12px; padding:20px; margin-bottom:20px; }
  .cat-block h3{ font-size:18px; margin-bottom:15px; color:#3B2A1E; border-bottom:2px solid #E2D2B4; padding-bottom:10px; }
  .item{ background:#F6EEE1; padding:15px; margin-bottom:10px; border-radius:8px; border:1px solid #E2D2B4; }
  .item-row{ display:grid; grid-template-columns:1fr 80px 80px; gap:10px; align-items:center; margin-bottom:8px; }
  input, textarea{ padding:8px 10px; border:1px solid #E2D2B4; border-radius:6px; font-family:'Tajawal'; font-size:14px; width:100%; }
  label{ display:block; font-size:12px; color:#7A6650; margin-bottom:4px; margin-top:8px; }
  button{ padding:10px 15px; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-family:'Tajawal'; font-size:13px; }
  .btn-add{ background:#C1704A; color:#fff; width:100%; margin-top:10px; }
  .btn-del{ background:#B3413A; color:#fff; padding:6px 10px; font-size:12px; }
  .btn-export{ background:#3B2A1E; color:#fff; width:100%; padding:12px; margin-top:20px; }
  .btn-secondary{ background:#fff; border:1px solid #E2D2B4; color:#3B2A1E; width:48%; }
  .bottom-buttons{ display:flex; gap:10px; margin-top:20px; }
  .modal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; z-index:100; }
  .modal.open{ display:flex; }
  .modal-box{ background:#fff; border-radius:12px; padding:30px; max-width:600px; width:100%; max-height:80vh; overflow-y:auto; }
  .modal-box h2{ margin-bottom:15px; }
  .modal-box textarea{ min-height:300px; }
  .modal-buttons{ display:flex; gap:10px; margin-top:15px; }
  .modal-buttons button{ flex:1; }
  .qr-container{ text-align:center; padding:20px; }
  .qr-canvas{ max-width:300px; margin:0 auto; }
</style>
</head>
<body>

<header>
  <h1>لوحة إدارة القائمة</h1>
  <p>مخبز صاروج بيكري</p>
</header>

<div class="main" id="mainContent"></div>

<div class="bottom-buttons">
  <button class="btn-secondary" id="previewBtn">👁 معاينة</button>
  <button class="btn-secondary" id="qrcodeBtn">📱 باركود</button>
  <button class="btn-export" id="exportBtn">تصدير ⇩</button>
</div>

<div class="modal" id="exportModal">
  <div class="modal-box">
    <h2>انسخ هذا النص في data.js</h2>
    <textarea id="exportText" readonly></textarea>
    <div class="modal-buttons">
      <button class="btn-secondary" onclick="document.getElementById('exportModal').classList.remove('open')">إغلاق</button>
      <button class="btn-export" onclick="copyToClipboard()">نسخ</button>
    </div>
  </div>
</div>

<div class="modal" id="qrcodeModal">
  <div class="modal-box">
    <h2>الباركود - QR Code</h2>
    <div class="qr-container">
      <img id="qrcodeImg" src="" alt="QR Code" style="max-width:300px; border:2px solid #E2D2B4; padding:10px; border-radius:10px;">
    </div>
    <p style="text-align:center; margin:15px 0; color:#7A6650; font-size:13px;">أظهر على الطاولات</p>
    <div id="qrcodeUrl" style="background:#F6EEE1; padding:10px; border-radius:8px; word-break:break-all; font-size:12px; font-family:monospace; margin-bottom:15px;"></div>
    <button class="btn-export" onclick="downloadQR()">تحميل</button>
    <button class="btn-secondary" style="width:100%; margin-top:10px;" onclick="document.getElementById('qrcodeModal').classList.remove('open')">إغلاق</button>
  </div>
</div>

<script>
const CATEGORIES = [
  {id:"iced-tea",nameAr:"الشاي المثلج",items:[{id:"it-1",nameAr:"خوخ وباشن",price:1.000,image:"",available:true},{id:"it-2",nameAr:"مانجو",price:1.000,image:"",available:true},{id:"it-3",nameAr:"فراولة",price:1.000,image:"",available:true},{id:"it-4",nameAr:"توت أزرق",price:1.000,image:"",available:true}]},
  {id:"teapot",nameAr:"أباريق الشاي",items:[{id:"tp-1",nameAr:"أزهار البابونج",price:0.700,image:"",available:true},{id:"tp-2",nameAr:"الزعفران",price:0.700,image:"",available:true},{id:"tp-3",nameAr:"الليمون والزنجبيل",price:0.700,image:"",available:true},{id:"tp-4",nameAr:"لافندر",price:0.700,image:"",available:true}]},
  {id:"mojitos",nameAr:"موهيتو",items:[{id:"mj-1",nameAr:"الفراولة",price:1.000,image:"",available:true},{id:"mj-2",nameAr:"الخوخ",price:1.000,image:"",available:true},{id:"mj-3",nameAr:"التوت الأزرق",price:1.000,image:"",available:true},{id:"mj-4",nameAr:"الليمون",price:1.000,image:"",available:true},{id:"mj-5",nameAr:"الرمان",price:1.000,image:"",available:true},{id:"mj-6",nameAr:"باشن",price:1.000,image:"",available:true}]},
  {id:"ice-cream",nameAr:"آيسكريم",items:[{id:"ic-1",nameAr:"مخروط فراولة",price:1.600,image:"",available:true},{id:"ic-2",nameAr:"مخروط فانيلا",price:1.600,image:"",available:true},{id:"ic-3",nameAr:"مخروط مكس",price:1.600,image:"",available:true},{id:"ic-4",nameAr:"كوب فراولة",price:0.900,image:"",available:true},{id:"ic-5",nameAr:"كوب فانيلا",price:0.900,image:"",available:true},{id:"ic-6",nameAr:"كوب مكس",price:0.900,image:"",available:true}]},
  {id:"cold-coffee",nameAr:"القهوة الباردة",items:[{id:"cc-1",nameAr:"سبانيش لاتيه",price:1.300,image:"",available:true},{id:"cc-2",nameAr:"كرامل لاتيه",price:1.300,image:"",available:true},{id:"cc-3",nameAr:"زعفران لاتيه",price:1.300,image:"",available:true},{id:"cc-4",nameAr:"بيستاشيو لاتيه",price:1.300,image:"",available:true},{id:"cc-5",nameAr:"دارك موكا",price:1.300,image:"",available:true},{id:"cc-6",nameAr:"وايت موكا",price:1.300,image:"",available:true},{id:"cc-7",nameAr:"كركديه",price:1.000,image:"",available:true},{id:"cc-8",nameAr:"كورتادو",price:1.300,image:"",available:true},{id:"cc-9",nameAr:"ماتشا",price:1.400,image:"",available:true},{id:"cc-10",nameAr:"أفوكاتو",price:1.500,image:"",available:true},{id:"cc-11",nameAr:"كريمي إسبريسو",price:1.400,image:"",available:true},{id:"cc-12",nameAr:"روز لاتيه",price:1.300,image:"",available:true},{id:"cc-13",nameAr:"ماء",price:0.100,image:"",available:true}]},
  {id:"frappe",nameAr:"فراب",items:[{id:"fr-1",nameAr:"بيستاشيو فراب",price:1.800,image:"",available:true},{id:"fr-2",nameAr:"كرامل فراب",price:1.800,image:"",available:true},{id:"fr-3",nameAr:"موكا فراب",price:1.800,image:"",available:true}]},
  {id:"hot-coffee",nameAr:"القهوة الساخنة",items:[{id:"hc-1",nameAr:"سبانيش لاتيه",price:1.300,image:"",available:true},{id:"hc-2",nameAr:"كرامل لاتيه",price:1.300,image:"",available:true},{id:"hc-3",nameAr:"زعفران لاتيه",price:1.300,image:"",available:true},{id:"hc-4",nameAr:"بيستاشيو لاتيه",price:1.300,image:"",available:true},{id:"hc-5",nameAr:"موكا",price:1.300,image:"",available:true},{id:"hc-6",nameAr:"كورتادو",price:1.300,image:"",available:true},{id:"hc-7",nameAr:"ماتشا",price:1.400,image:"",available:true},{id:"hc-8",nameAr:"كابتشينو",price:1.200,image:"",available:true},{id:"hc-9",nameAr:"لاتيه",price:1.300,image:"",available:true},{id:"hc-10",nameAr:"فلات وايت",price:1.300,image:"",available:true},{id:"hc-11",nameAr:"إسبريسو",price:0.900,image:"",available:true},{id:"hc-12",nameAr:"أمريكانو",price:1.000,image:"",available:true},{id:"hc-13",nameAr:"هوت شوكليت",price:1.400,image:"",available:true},{id:"hc-14",nameAr:"قهوة عمانية",price:1.000,image:"",available:true}]},
  {id:"cold-brew",nameAr:"كولد برو",items:[{id:"cb-1",nameAr:"V60 كلاسيك",price:1.500,image:"",available:true},{id:"cb-2",nameAr:"V60 فروتي",price:1.600,image:"",available:true},{id:"cb-3",nameAr:"كولد برو",price:1.600,image:"",available:true}]},
  {id:"bakery",nameAr:"الحلويات والمخبوزات",items:[{id:"bk-1",nameAr:"كرواسون سادة",price:1.000,image:"",available:true},{id:"bk-2",nameAr:"كرواسون شوكليت",price:1.400,image:"",available:true},{id:"bk-3",nameAr:"كرواسون تركي",price:1.700,image:"",available:true},{id:"bk-4",nameAr:"كرواسون حلومي",price:1.700,image:"",available:true},{id:"bk-5",nameAr:"كرواسون بيض",price:1.700,image:"",available:true},{id:"bk-6",nameAr:"دانيش بيري",price:1.000,image:"",available:true},{id:"bk-7",nameAr:"شوكليت كيك",price:2.500,image:"",available:true},{id:"bk-8",nameAr:"كريمي كيك",price:2.500,image:"",available:true},{id:"bk-9",nameAr:"كيكة التمر",price:2.500,image:"",available:true},{id:"bk-10",nameAr:"بيستاشيو كيك",price:2.500,image:"",available:true}]}
];
const SHOP_NAME_AR="مخبز صاروج بيكري",SHOP_NAME_EN="Sarouj Bakery",CURRENCY_LABEL="ر.ع.";

let workingData = JSON.parse(JSON.stringify(CATEGORIES));

function render(){
  const html = workingData.map((cat,ci)=>`
    <div class="cat-block">
      <h3><input value="${cat.nameAr}" onchange="workingData[${ci}].nameAr=this.value; render();" style="border:none; background:transparent; width:100%;"></h3>
      ${cat.items.map((it,ii)=>`
        <div class="item">
          <div class="item-row">
            <input value="${it.nameAr}" onchange="workingData[${ci}].items[${ii}].nameAr=this.value;">
            <input type="number" step="0.001" value="${it.price}" onchange="workingData[${ci}].items[${ii}].price=parseFloat(this.value||0);">
            <label><input type="checkbox" ${it.available?'checked':''} onchange="workingData[${ci}].items[${ii}].available=this.checked;"> متوفر</label>
            <button class="btn-del" onclick="workingData[${ci}].items.splice(${ii},1); render();">✕</button>
          </div>
          <label>رابط الصورة:</label>
          <input type="url" value="${it.image||''}" onchange="workingData[${ci}].items[${ii}].image=this.value;" placeholder="https://...">
        </div>
      `).join('')}
      <button class="btn-add" onclick="workingData[${ci}].items.push({id:'new',nameAr:'منتج جديد',price:0.5,image:'',available:true}); render();">+ منتج</button>
    </div>
  `).join('');
  document.getElementById('mainContent').innerHTML = html;
}

document.getElementById('exportBtn').addEventListener('click',()=>{
  let out = `const CATEGORIES = [`;
  workingData.forEach((cat,ci)=>{
    out += `{id:"${cat.id}",nameAr:"${cat.nameAr.replace(/"/g,'\\"')}",items:[`;
    cat.items.forEach((it,ii)=>{
      out += `{id:"${it.id}",nameAr:"${it.nameAr.replace(/"/g,'\\"')}",price:${Number(it.price).toFixed(3)},image:"${(it.image||'').replace(/"/g,'\\"')}",available:${it.available}}${ii<cat.items.length-1?',':''}`;
    });
    out += `]}${ci<workingData.length-1?',':''}`;
  });
  out += `];\nconst SHOP_NAME_AR="${SHOP_NAME_AR}";\nconst SHOP_NAME_EN="${SHOP_NAME_EN}";\nconst CURRENCY_LABEL="${CURRENCY_LABEL}";\nconst CURRENT_LANG="ar";`;
  document.getElementById('exportText').value = out;
  document.getElementById('exportModal').classList.add('open');
});

function copyToClipboard(){
  const text = document.getElementById('exportText');
  text.select();
  document.execCommand('copy');
  alert('تم النسخ!');
}

document.getElementById('previewBtn').addEventListener('click',()=>window.open('index.html','_blank'));

document.getElementById('qrcodeBtn').addEventListener('click',()=>{
  const url = 'https://maawali-s.github.io/menu/index.html';
  document.getElementById('qrcodeUrl').textContent = url;
  const qrcodeAPI = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(url)}`;
  document.getElementById('qrcodeImg').src = qrcodeAPI;
  document.getElementById('qrcodeModal').classList.add('open');
});

function downloadQR(){
  const img = document.getElementById('qrcodeImg');
  const link = document.createElement('a');
  link.href = img.src;
  link.download = 'menu-qr.png';
  link.click();
}

render();
</script>
</body>
</html>
